# ============ 固定値 ============
constants:
  childIndepAge: 22
  pensionAge: 65
  shortageThreshold: 3000000 # これ未満は「不足」と呼ばない
  roundUnit: 1000000 # 100万円単位に丸め

# ============ 入力レンジ→代表値（DR-02 の正規化） ============
# 制度パラメータではなく「レンジ選択を算定エンジンの点の値に写像する前提」。当社基準。
# 各バケツの中点（下限=1つ下の上限、最初は0）。開区間 gte は裾を見て上に寄せる。
# expiry/verified ゲートの対象外（public/toBeSourced には置かない）。値は円単位の整数。
# 見直したらこの版のログを残すこと（金額に直結するため）。
inputRanges:
  income: # 本人・配偶者の年収
    lt400: 2000000
    lt600: 5000000
    lt800: 7000000
    lt1000: 9000000
    gte1000: 12000000
    none: 0 # 配偶者「収入なし」
    prefer_not: 3000000 # 「答えたくない」＝区分エ相当で仮置き（推定フラグ）
  assets: # 金融資産・世帯合計
    lt100: 500000
    lt300: 2000000
    lt500: 4000000
    lt1000: 7500000
    gte1000: 15000000
    unknown: 3000000 # 「分からない」→300万で仮置き（推定フラグ・§3.2指定）
  monthlyLiving: # 毎月の生活費（住居費込み／住宅ローン返済は除く）。円/月
    lt20: 175000
    lt25: 225000
    lt30: 275000
    lt35: 325000
    gte35: 400000
  loan: # 住宅ローン残高（団信なしのときだけ必要額に乗る）
    lt500: 2500000
    lt1000: 7500000
    lt1500: 12500000
    lt2000: 17500000
    lt3000: 25000000
    gte3000: 35000000
    unknown: 15000000 # 「分からない」で仮置き（推定フラグ）
  coverage: # 現在の死亡保障額（被保険者ごと）。証券に書かれた値なので中央値ではなく具体額。
    # 必要額レンジと直接比べて過不足を出すため、代表値の誤差を持ち込まない（レンジにしない）。
    # 「分からない」はここに置かず、normalize 側で null にして過不足を pending にする。
    none: 0 # 加入していない
    m300: 3000000
    m500: 5000000
    m1000: 10000000
    m1500: 15000000
    m2000: 20000000
    m3000: 30000000
    m5000: 50000000
    gte10000: 100000000 # 1億円以上。過大側は floor で控えめに（誤って「減らせる」と言わない側）

# ============ 教育費（段階別・子供の学習費調査ベース） ============
# 「学習費総額」＝授業料に加え、塾(補助学習費)・部活(教科外活動費)・行事・修学旅行・制服・寄付を含む実支出。
# 子の現年齢から、残りの各年を段階に割り当てて実額を積む（§4.2.2）。就学支援金は別に控除する。
# 出典: 文部科学省 令和5年度子供の学習費調査（2024-12公表）。幼小中高は本番前に公式PDFで照合すること。
education:
  # 地域係数（都会↑/地方↓）。当面は全国平均=1.0。将来 文科省「都市階級別」で係数化する。
  regionFactor: 1.0
  stages:
    kinder: { fromAge: 3, toAge: 5, public: 184644, private: 347338 } # 幼稚園
    primary: { fromAge: 6, toAge: 11, public: 336265, private: 1828112 } # 小学校
    junior: { fromAge: 12, toAge: 14, public: 542475, private: 1560359 } # 中学校
    high: { fromAge: 15, toAge: 17, public: 597752, private: 1030283 } # 高校(全日)
  # 大学（18-21歳）は年額換算＝4年総額÷4。二次情報ベースなので一次情報（文科省 私立大学等授業料調査）で要確認。
  university:
    fromAge: 18
    toAge: 21
    national: 606300 # 国立: (入学料282,000＋授業料535,800×4)/4
    privateLiberal: 1045000 # 私立文系: 約418万/4
    privateScience: 1417500 # 私立理系: 約567万/4
    verified: false
  # 就学支援金（高校無償化・2026年度・所得制限なし）。年額。教育費から明示的に控除する。
  shien:
    publicHigh: 118800 # 公立高
    privateHigh: 457000 # 私立高（私立平均授業料まで）
    verified: false
  # プリセット→段階パターン。「まだ決めていない」は normalize 側で public に仮置きし推定フラグを立てる。
  presets:
    public: { kinder: public, primary: public, junior: public, high: public, university: national }
    mixed: { kinder: private, primary: public, junior: public, high: private, university: privateLiberal }
    private: { kinder: private, primary: private, junior: private, high: private, university: privateScience }

name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI はコードを読んでテストするだけなので、GITHUB_TOKEN は読み取りに絞る。
# 既定はリポジトリ設定まかせで、書き込み権限が渡ることがある。
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

# GitHub の main に push されたら、ビルドして Cloud Run に出す。
#
# gemini-case-navi と同じ形（Cloud Build トリガー）。手元に Docker は要らない ─
# ビルドはここで走る。トリガーの作成は README ではなく docs/本番前チェックリスト.md「G」に書く。
#
# 注意：**参照している Secret が1つでも無いと deploy ステップで落ちる。**
# T-13（気づき通知）で slack-webhook-url と watch-cron-secret を足したので、
# main にマージする前に Secret Manager に作り、ビルド用SAに accessor を付けておくこと。
# 手順は docs/本番前チェックリスト.md「G」。
#
# 注意：**検証ビルドの間は verified:false のパラメータが残っている。**
# 本番として開ける（strictVerified を有効にする）のは、A〜C を潰してから。

substitutions:
  _SERVICE: okane-kenko
  _REGION: asia-northeast1
  _REPO: okane-kenko

steps:
  # 1. イメージを作る。$SHORT_SHA で「どのコミットが動いているか」を後から追えるようにする
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  # 2. Cloud Run に出す。
  #    GEMINI_API_KEY は Secret Manager から渡す（値をこのファイルにも環境変数にも書かない）。
  #    鍵が未設定でも診断は成立する（AI言語化が定型文に退避するだけ）ので、
  #    秘密が用意できていない段階でもデプロイできる。
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=3
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,SLACK_WEBHOOK_URL=slack-webhook-url:latest,WATCH_CRON_SECRET=watch-cron-secret:latest
      # WATCH_BASE_URL は通知リンク（/notice/{token}）を組み立てる公開URLで、秘密ではない。
      # Secret Manager に入れると権限と版の管理が増えるだけなので、素の環境変数で渡す。
      - --set-env-vars=WATCH_BASE_URL=https://okane-kenko-caiwgo7uta-an.a.run.app

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
